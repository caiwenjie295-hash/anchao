<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>A34 定向验收入口</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #111318; color: #e6e8eb; }
      body { margin: 0; min-width: 320px; }
      .a34-fixture { display: grid; gap: 1rem; margin: 0 auto; max-width: 1360px; padding: 1rem; }
      .a34-fixture__header { border: 1px solid #424751; border-radius: 12px; padding: 1rem; }
      .a34-fixture__header h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
      .a34-fixture__header p { margin: .4rem 0; color: #c1c7d0; }
      .a34-fixture__modes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
      .a34-fixture__modes button { min-height: 2.75rem; border: 1px solid #717986; border-radius: 8px; padding: .5rem .75rem; background: #252a32; color: inherit; font: inherit; cursor: pointer; }
      .a34-fixture__modes button[aria-pressed="true"] { border-color: #d9ba79; background: #423a2b; }
      .a34-fixture__note { border-left: 3px solid #d9ba79; padding-left: .75rem; }
      @media (max-width: 540px) { .a34-fixture { padding: .5rem; } .a34-fixture__header { padding: .75rem; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./fixture.tsx"></script>
  </body>
</html>
