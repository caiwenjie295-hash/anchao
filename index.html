<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1720" />
    <title>暗潮 · 四幕互动调查体验</title>
    <style>
      html, body { margin: 0; background: #0b1720; }
      #anchao-startup { --startup-ink: #efede5; position: fixed; z-index: 40000; inset: 0; box-sizing: border-box; display: grid; place-items: center; overflow: auto; padding: 28px; background: radial-gradient(ellipse at 50% 42%, #1c3039 0%, #101f29 42%, #08131c 100%); color: var(--startup-ink); font: 14px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
      #anchao-startup::before { position: absolute; inset: 22px; border: 1px solid rgb(190 164 111 / 22%); pointer-events: none; content: ""; }
      .anchao-startup__content { position: relative; width: min(430px, 100%); text-align: left; }
      .anchao-startup__title { margin: 0 0 30px; color: #f4f0e4; font: 500 clamp(42px, 8vw, 68px)/1.1 "Songti SC", "Noto Serif SC", "SimSun", serif; letter-spacing: .28em; text-indent: .18em; }
      #anchao-startup-copy { margin: 0 0 18px; color: #d2d8d4; font-size: 14px; font-weight: 400; }
      .anchao-startup__track { position: relative; height: 3px; margin-top: 28px; overflow: hidden; background: #35474d; }
      #anchao-startup-fill { position: relative; width: 3%; height: 100%; background: #b99b61; transition: width 300ms linear; }
      #anchao-startup-fill::after { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #f5e6c3, transparent); transform: translateX(-100%); animation: anchao-startup-shine 1.8s ease-in-out infinite; content: ""; }
      #anchao-startup-progress { margin: 11px 0 0; color: #d0b77e; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .08em; }
       .anchao-startup__stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 21px 0 0; padding-top: 12px; border-top: 1px solid rgb(202 194 169 / 24%); font-size: 11px; color: #aebcbd; }
      .anchao-startup__stats dt { margin-bottom: 3px; }
      .anchao-startup__stats dd { margin: 0; color: #e1e4dc; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #anchao-startup-detail { min-height: 3.4em; margin: 16px 0 0; color: #b6c0bc; font-size: 12px; overflow-wrap: anywhere; }
      @media (max-width: 340px) { #anchao-startup { padding: 18px; } .anchao-startup__stats { grid-template-columns: 1fr; gap: 6px; } .anchao-startup__stats div { display: flex; justify-content: space-between; gap: 12px; } }
      @media (max-height: 400px) { #anchao-startup { place-items: start center; padding-block: 18px; } .anchao-startup__title { margin-bottom: 12px; } }
      #anchao-startup-retry { min-height: 44px; margin-top: 20px; padding: 8px 24px; border: 1px solid #b89a5d; border-radius: 2px; color: #f5efdf; background: #725a32; box-shadow: 0 2px 0 #493b27; font: inherit; cursor: pointer; transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease; }
      #anchao-startup-retry:hover { background: #866d40; }
      #anchao-startup-retry:active { transform: translateY(2px); box-shadow: none; }
      #anchao-startup-retry:focus-visible { outline: 3px solid #e2c27e; outline-offset: 4px; }
      #anchao-startup-retry[hidden] { display: none; }
      @keyframes anchao-startup-shine { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #anchao-startup-fill, #anchao-startup-retry { transition: none; } #anchao-startup-fill::after { animation: none; } #anchao-startup-retry:active { transform: none; } }
    </style>
  </head>
  <body>
    <div id="anchao-startup" aria-busy="true">
      <div class="anchao-startup__content">
        <h1 class="anchao-startup__title">暗潮</h1>
        <p id="anchao-startup-copy" role="status" aria-live="polite">正在准备第一、二幕与共享内容……</p>
        <div class="anchao-startup__track" role="progressbar" aria-label="准备进入暗潮" aria-valuemin="0" aria-valuemax="100" aria-valuenow="3"><div id="anchao-startup-fill"></div></div>
        <p id="anchao-startup-progress" aria-hidden="true">3%</p>
        <dl class="anchao-startup__stats" aria-label="资源下载统计">
          <div><dt>总大小</dt><dd id="anchao-startup-total">待确认</dd></div>
          <div><dt>已加载</dt><dd id="anchao-startup-loaded">0.00 MB</dd></div>
          <div><dt>下载速度</dt><dd id="anchao-startup-speed">0.0 KB/s</dd></div>
        </dl>
        <p id="anchao-startup-detail">正在确认资源清单……</p>
        <button id="anchao-startup-retry" type="button" hidden>重新加载</button>
        <noscript>请开启 JavaScript 后重新打开。</noscript>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        if (!document.getElementById('anchao-startup') || !(event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)) return;
        var shell = document.getElementById('anchao-startup');
        shell.dataset.entryError = 'true';
        shell.setAttribute('aria-busy', 'false');
        var file = '入口脚本或样式';
        try {
          var path = new URL(event.target.src || event.target.href, location.href).pathname;
          var directory = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
          file = decodeURIComponent(path.startsWith(directory) ? path.slice(directory.length) : path).replace(/[\u0000-\u001f\u007f]/g, '').slice(0, 240);
        } catch (_) {}
        shell.dataset.entryFile = file;
        document.getElementById('anchao-startup-copy').textContent = '页面未能完整加载，请刷新后重试。';
        document.getElementById('anchao-startup-detail').textContent = '入口脚本或样式未能完整加载，需要刷新页面。文件：' + file;
        document.getElementById('anchao-startup-speed').textContent = '0.0 KB/s';
        var retry = document.getElementById('anchao-startup-retry');
        retry.hidden = false;
        retry.textContent = '刷新页面';
        retry.onclick = function () { location.reload(); };
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
